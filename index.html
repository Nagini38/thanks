<!doctype html>
<html lang="fr">
<head>
  <script>if(sessionStorage.getItem("auth")!=="1"){window.location.replace("/login.html")}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
  <title>Accès sécurisé — L'entrée</title>
  <meta name="description" content="Une expérience immersive : plus vous descendez, plus vous pénétrez dans la pièce sécurisée." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Écran de rendu (fixe) : le décor scrubbé par le scroll -->
  <div id="stage" aria-hidden="true">
    <canvas id="scene"></canvas>
    <!-- Vidéo utilisée uniquement en mode "video" (masquée sinon) -->
    <video id="scrubVideo" playsinline muted preload="auto"></video>

    <!-- Grain + vignette d'ambiance -->
    <div class="overlay-grain"></div>
    <div class="overlay-vignette"></div>

    <!-- HUD : volant de porte blindée qui tourne selon le scroll -->
    <svg id="vaultHud" class="vault-hud" viewBox="0 0 200 200" aria-hidden="true">
      <g class="vault-ring">
        <circle cx="100" cy="100" r="92" class="vh-rim" />
        <circle cx="100" cy="100" r="78" class="vh-rim2" />
      </g>
      <g id="vaultWheel" class="vault-wheel">
        <circle cx="100" cy="100" r="60" class="vh-hub" />
        <circle cx="100" cy="100" r="14" class="vh-center" />
        <!-- rayons du volant -->
        <g class="vh-spokes">
          <rect x="96" y="18"  width="8" height="164" rx="4" />
          <rect x="96" y="18"  width="8" height="164" rx="4" transform="rotate(60 100 100)" />
          <rect x="96" y="18"  width="8" height="164" rx="4" transform="rotate(120 100 100)" />
        </g>
        <circle cx="100" cy="26" r="9" class="vh-knob" />
      </g>
    </svg>

  </div>

  <!-- Piste de scroll : sa hauteur définit la longueur de l'expérience -->
  <div id="scrolltrack"></div>

  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
