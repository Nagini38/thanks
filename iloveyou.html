<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
  <title>I love you &lt;3</title>
  <meta name="description" content="Un cœur de mille « love you » qui s'allume, en bleu." />
  <style>
    :root {
      --bg: #000;
      --ink: #e8e6df;
      --font: "Helvetica Neue", Arial, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font-family: var(--font); color: var(--ink); }

    #heart { display: block; width: 100vw; height: 100vh; background: var(--bg); }

    /* Écran d'entrée : un clic est requis pour lancer le son */
    #enter {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.4rem; text-align: center; cursor: pointer;
      background: radial-gradient(120% 120% at 50% 45%, #04121f 0%, #000 70%);
      transition: opacity .8s ease;
    }
    #enter.hidden { opacity: 0; pointer-events: none; }
    #enter h1 {
      margin: 0; font-weight: 700; letter-spacing: .04em;
      font-size: clamp(1.6rem, 6vw, 3rem);
      color: #cfe6ff; text-shadow: 0 0 24px rgba(30,144,255,.55);
    }
    #enter p {
      margin: 0; font-size: clamp(.85rem, 2.6vw, 1.05rem);
      color: #7fa8d6; letter-spacing: .18em; text-transform: uppercase;
    }
    #enter .pulse {
      width: 14px; height: 14px; border-radius: 50%;
      background: #1e90ff; box-shadow: 0 0 18px 4px rgba(30,144,255,.7);
      animation: beat 1.1s ease-in-out infinite;
    }
    @keyframes beat { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.35);opacity:1} }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>

  <div id="enter">
    <h1>I&nbsp;love&nbsp;you&nbsp;&lt;3</h1>
    <div class="pulse"></div>
    <p>Cliquez pour entrer</p>
  </div>

  <audio id="song" src="love_you.mp3" preload="auto"></audio>

  <script>
  /* ============================================================
     iloveyou.html — port web (canvas) de heart_blue.py
     1) le cœur de mots « love you » s'allume
     2) on plonge dedans : tunnel de mots qui accélère
     3) un second cœur apparaît, battant sur le tempo du morceau
     4) il explose, puis tout recommence
     ============================================================ */
  (function () {
    "use strict";

    // --- Constantes (miroir du script pygame) ---
    const SCALE_REF = 20;               // échelle de référence (script pygame)
    const FPS = 60;
    const WORDS = ["love you", "Love You", "LOVE YOU"];
    const CENTER_TEXT = " Love You ";
    const COLORS = [
      [70, 130, 180],
      [30, 144, 255],
      [0, 191, 255],
      [100, 149, 237],
      [65, 105, 225],
    ];

    // --- Tempo de love_you.mp3 (mesuré sur le fichier : onsets + autocorrélation) ---
    const BEAT = 0.5592;                // 107,3 BPM
    const BEAT0 = 0.432;                // premier temps du morceau
    const SONG_LEN = 18.126;            // durée du morceau (joué en boucle)
    const DIVE = 4.6;                   // durée du tunnel (s)
    const TUN_END = 0.24;               // profondeur à laquelle un mot est "passé"
    const HOLD = 7.0;                   // durée du cœur qui bat (s)
    const BOOM = 2.8;                   // durée de l'explosion (s)

    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    let W, H, SCALE, cx, cy;

    function heartXY(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return [x, -y];
    }
    function toScreen(x, y) {
      return [x * SCALE + cx, y * SCALE + cy];
    }

    // Boîte englobante du cœur en unités de dessin (pour le caler sur l'écran)
    function heartBounds() {
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i <= 720; i++) {
        const [x, y] = heartXY((i / 720) * Math.PI * 2);
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
      return { x0, x1, y0, y1, w: x1 - x0, h: y1 - y0 };
    }

    function rand(a, b) { return a + Math.random() * (b - a); }
    function choice(arr) { return arr[(Math.random() * arr.length) | 0]; }

    function makeParticle(x, y, order, kind) {
      const [r, g, b] = choice(COLORS);
      return {
        x, y, order, kind,
        word: choice(WORDS),
        color: `${r},${g},${b}`,
        alpha: 0,
        flicker: rand(0, Math.PI * 2),
        delay: 0,
        delayT: 0,
        sizeMult: rand(0.85, 1.15),
        fontPx: kind === "outline" ? 20 : 17,
      };
    }

    function buildOutline(nOutline, minGap) {
      const particles = [], placed = [];
      for (let i = 0; i < nOutline; i++) {
        const t = (i / nOutline) * 2 * Math.PI;
        const [bx, by] = heartXY(t);
        const [sx, sy] = toScreen(bx, by);
        let tooClose = false;
        for (const [px, py] of placed) {
          if (Math.hypot(sx - px, sy - py) < minGap) { tooClose = true; break; }
        }
        if (tooClose) continue;
        placed.push([sx, sy]);
        particles.push(makeParticle(sx, sy, i, "outline"));
      }
      return particles;
    }

    function buildFill(nFill, minGap) {
      const particles = [], placed = [];
      let attempts = 0;
      const maxAttempts = nFill * 80;
      while (particles.length < nFill && attempts < maxAttempts) {
        attempts++;
        const t = rand(0, 2 * Math.PI);
        const r = rand(0.0, 0.86);
        const [bx, by] = heartXY(t);
        const [sx, sy] = toScreen(bx * r, by * r);
        let tooClose = false;
        for (const [qx, qy] of placed) {
          if (Math.hypot(sx - qx, sy - qy) < minGap) { tooClose = true; break; }
        }
        if (tooClose) continue;
        placed.push([sx, sy]);
        particles.push(makeParticle(sx, sy, (Math.random() * 321) | 0, "fill"));
      }
      return particles;
    }

    let particles = [];
    let fillStartFrame = 0;
    let centerFontPx = 54;

    function build() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vw = window.innerWidth, vh = window.innerHeight;
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      canvas.style.width = vw + "px";
      canvas.style.height = vh + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      W = vw; H = vh; cx = vw / 2; cy = vh / 2;

      // Échelle : on dimensionne le CŒUR (et non la zone de référence
      // 2000x1200) sur l'écran, pour qu'il occupe presque toute la largeur.
      // Les tailles de police / gaps restent calquées sur SCALE_REF.
      const hb = heartBounds();
      const pad = 40;                         // marge : halo + mots qui dépassent
      SCALE = Math.min((vw - 2 * pad) / hb.w, (vh / 2 - pad) / hb.y1);
      const k = SCALE / SCALE_REF;            // facteur vs script d'origine
      const minGapOutline = 30 * k;
      const minGapFill = 46 * k;
      centerFontPx = 54 * k;

      const outline = buildOutline(160, minGapOutline);
      const fill = buildFill(130, minGapFill);
      for (const p of outline) p.fontPx = 20 * k;
      for (const p of fill) p.fontPx = 17 * k;

      const outlineSpan = outline.reduce((m, p) => Math.max(m, p.order), 0);
      const framesPerStep = 1.6;
      fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

      for (const p of fill) p.delay = fillStartFrame + p.order;
      for (const p of outline) p.delay = Math.floor(p.order * framesPerStep);

      particles = outline.concat(fill);
    }

    function drawGlowText(word, colorRGB, x, y, alpha, fontPx) {
      if (alpha <= 0) return;
      const a = Math.max(0, Math.min(255, alpha)) / 255;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${Math.max(1, fontPx).toFixed(1)}px Arial, sans-serif`;
      if (alpha > 10) {
        ctx.save();
        ctx.shadowColor = `rgba(${colorRGB},${a})`;
        ctx.shadowBlur = fontPx * 1.6;
        ctx.fillStyle = `rgba(${colorRGB},${a * 0.5})`;
        ctx.fillText(word, x, y);
        ctx.shadowBlur = fontPx * 0.9;
        ctx.fillStyle = `rgba(${colorRGB},${a * 0.9})`;
        ctx.fillText(word, x, y);
        ctx.restore();
      }
      ctx.fillStyle = `rgba(${colorRGB},${a})`;
      ctx.fillText(word, x, y);
    }

    /* ---------- rythme : pulsation calée sur le morceau ---------- */
    function thump(t) {
      const tm = ((t % SONG_LEN) + SONG_LEN) % SONG_LEN;
      const k = Math.round((tm - BEAT0) / BEAT);
      const dtb = tm - (BEAT0 + k * BEAT);
      if (dtb < 0) return 0;
      const accent = (((k - 1) % 4) + 4) % 4 === 0 ? 1 : 0.42;
      return Math.exp(-dtb * 8.5) * accent;
    }

    /* ---------- 2) on plonge dans le cœur : TOUS ses mots filent vers la caméra ---------- */
    let centerZ = 1;
    let warpZ = 1;

    function initWarp() {
      for (const p of particles) {
        p.z = rand(TUN_END + 0.05, 1.0);
        p.wz = rand(0.7, 1.45);
        p.wrot = rand(-0.05, 0.05);
        p.wx = p.x - cx;
        p.wy = p.y - cy;
      }
      centerZ = 1;
      warpZ = 1;
    }

    function drawFast(word, col, x, y, a, fontPx) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${Math.max(1, fontPx).toFixed(1)}px Arial, sans-serif`;
      ctx.fillStyle = `rgba(${col},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
      ctx.fillText(word, x, y);
    }

    function drawWarp(dt, tt, fade, speedMul) {
      const prog = Math.min(1, tt / DIVE);
      const speed = (0.40 + 2.2 * prog * prog) * speedMul;
      const maxF = Math.max(W, H) * 0.26;
      let zsum = 0;
      for (const p of particles) {
        p.z -= speed * p.wz * dt;
        if (p.z <= TUN_END) {                    // passé derrière la caméra : il repart au fond
          p.z = 1.0;
          p.wz = rand(0.7, 1.45);
          p.wrot = rand(-0.05, 0.05);
        }
        zsum += p.z;
        const kk = 1 / p.z;
        let dx = p.wx, dy = p.wy;
        if (p.wrot) {
          const rot = p.wrot * (1 - p.z) * 5;    // léger vrillage du tunnel
          const c = Math.cos(rot), sn = Math.sin(rot);
          const nx = dx * c - dy * sn, ny = dx * sn + dy * c;
          dx = nx; dy = ny;
        }
        const near = Math.min(1, (p.z - TUN_END) / 0.09);
        const a = near * fade * (0.32 + 0.68 * (1 - p.z));
        if (a <= 0.012) continue;
        drawFast(p.word, p.color, cx + dx * kk, cy + dy * kk, a * 0.95, Math.min(p.fontPx * p.sizeMult * kk, maxF));
      }
      warpZ = zsum / (particles.length || 1);
      // le « Love You » central grossit puis passe devant la caméra et s'efface
      centerZ -= speed * 0.42 * dt;
      if (centerZ > TUN_END) {
        const a = Math.min(1, (centerZ - TUN_END) / 0.14) * fade;
        if (a > 0.01) {
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `bold ${Math.min(centerFontPx / centerZ, maxF * 1.6).toFixed(1)}px Georgia, serif`;
          ctx.shadowColor = `rgba(255,250,245,${(a * 0.6).toFixed(3)})`;
          ctx.shadowBlur = 30;
          ctx.fillStyle = `rgba(255,250,245,${a.toFixed(3)})`;
          ctx.fillText(CENTER_TEXT, cx, cy);
          ctx.restore();
        }
      }
    }

    /* ---------- 2) le tunnel de mots ---------- */
    let tunnel = [];
    function initTunnel() {
      tunnel = [];
      // mots alignés en RAYONS qui convergent vers le centre : c'est ce qui
      // donne la lecture "tunnel" (sinon on obtient juste un nuage de mots).
      const SECT = 12, PER = 5;
      for (let i = 0; i < SECT * PER; i++) {
        const [r, g, b] = choice(COLORS);
        tunnel.push({
          ang: (i % SECT) * (Math.PI * 2 / SECT) + rand(-0.08, 0.08),
          rad: rand(0.5, 1.2),
          z: rand(TUN_END + 0.02, 1.05),
          vs: rand(0.7, 1.45),
          spin: rand(-0.08, 0.08),
          word: choice(WORDS),
          col: `${r},${g},${b}`,
          sizeMult: rand(0.8, 1.25),
        });
      }
    }

    function drawTunnel(dt, tt, fade, speedMul) {
      if (fade <= 0.01) return;
      const base = 20 * (SCALE / SCALE_REF);
      const prog = Math.min(1, tt / DIVE);
      const speed = (0.40 + 2.2 * prog * prog) * speedMul;   // ça accélère
      const R = 0.22 * Math.min(W, H);
      const maxF = Math.max(W, H) * 0.24;
      for (const w of tunnel) {
        w.ang += w.spin * dt * 0.6;
        w.z -= speed * w.vs * dt;
        if (w.z <= TUN_END) {                  // le mot est passé : il repart au fond
          w.z = 1.05;
          w.rad = rand(0.5, 1.2);
          w.vs = rand(0.7, 1.45);
        }
        const kk = 1 / w.z;
        w.rad += (w.spin > 0 ? 0.02 : -0.02) * dt;
        if (w.rad < 0.42) w.rad = 0.42;
        if (w.rad > 1.25) w.rad = 1.25;
        const x = cx + Math.cos(w.ang) * w.rad * R * kk;
        const y = cy + Math.sin(w.ang) * w.rad * R * kk;
        const far = Math.min(1, (1.06 - w.z) * 2.4);            // apparition au loin
        const near = Math.min(1, (w.z - TUN_END) / 0.16);       // effacement avant la caméra
        const haze = 0.38 + 0.62 * Math.pow(1 - w.z, 1.2);      // brume : profondeur
        const a = Math.min(far, near) * fade * haze;
        if (a <= 0.012) continue;
        const fpx = Math.min(base * kk * w.sizeMult, maxF);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `bold ${Math.max(1, fpx).toFixed(1)}px Arial, sans-serif`;
        ctx.fillStyle = `rgba(${w.col},${(a * 0.92).toFixed(3)})`;
        ctx.fillText(w.word, x, y);
      }
    }

    /* ---------- 3) le second cœur, qui bat ---------- */
    let heart2 = [];

    function buildHeart2() {
      const saved = SCALE;
      SCALE = saved * 0.62;                       // cœur plus petit (au fond du tunnel)
      const k2 = SCALE / SCALE_REF;
      const outline = buildOutline(170, 30 * k2);
      const fill = buildFill(140, 46 * k2);
      for (const p of outline) p.fontPx = 20 * k2 * 1.3;   // mots un peu plus grands
      for (const p of fill) p.fontPx = 17 * k2 * 1.3;
      SCALE = saved;

      heart2 = outline.concat(fill);
      const span = outline.reduce((m, p) => Math.max(m, p.order), 0);
      let i = 0;
      for (const p of outline) p.delayT = 0.25 + (p.order / Math.max(1, span)) * 1.5;
      for (const p of fill) p.delayT = 1.9 + (i++) * 0.006;
    }

    function drawHeart2(tt, th) {
      const appear = Math.min(1, Math.max(0, (tt - 0.15) / 1.1));
      const scale = (0.88 + 0.12 * appear) * (1 + 0.075 * th);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      for (const p of heart2) {
        const t2 = tt - p.delayT;
        if (t2 <= 0) continue;
        const a = Math.min(255, t2 * 1100);
        let flick = 1;
        if (a >= 255) flick = 0.78 + 0.22 * Math.sin(tt * 2.6 + p.flicker);
        drawGlowText(p.word, p.color, p.x, p.y, a * flick * (0.85 + 0.45 * th), p.fontPx * p.sizeMult);
      }
      ctx.restore();
    }

    /* ---------- 4) l'explosion ---------- */
    let boom = null;

    function startBoom() {
      boom = [];
      for (const p of heart2) {
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.hypot(dx, dy) || 1;
        const sp = 170 + Math.random() * 470;
        boom.push({
          x: p.x, y: p.y,
          vx: (dx / d) * sp + rand(-80, 80),
          vy: (dy / d) * sp + rand(-80, 80),
          word: p.word, col: p.color,
          fontPx: p.fontPx * p.sizeMult,
        });
      }
    }

    function drawBoom(dt, tt) {
      const fade = 1 - Math.min(1, Math.max(0, (tt - 0.35) / (BOOM - 0.75)));
      for (const b of boom) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vx *= 0.985;
        b.vy *= 0.985;
        const a = fade;
        if (a <= 0.02) continue;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `bold ${Math.max(1, b.fontPx).toFixed(1)}px Arial, sans-serif`;
        ctx.shadowColor = `rgba(${b.col},${a.toFixed(3)})`;
        ctx.shadowBlur = Math.max(4, b.fontPx * 1.3);
        ctx.fillStyle = `rgba(${b.col},${a.toFixed(3)})`;
        ctx.fillText(b.word, b.x, b.y);
      }
      ctx.shadowBlur = 0;
      if (tt < 0.55) {                            // éclair blanc au moment du boum
        const f = 1 - tt / 0.55;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.85);
        g.addColorStop(0, `rgba(200,230,255,${(0.6 * f * f).toFixed(3)})`);
        g.addColorStop(0.35, `rgba(60,140,255,${(0.3 * f * f).toFixed(3)})`);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
    }

    /* ---------- boucle / machine à états ---------- */
    let frame = 0;
    let running = false;
    let phase = "build";
    let phaseT = 0;
    let lastT = 0;

    function drawParticles() {
      for (const p of particles) {
        let flick = 1.0;
        if (p.alpha >= 255) flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
        const alpha = p.alpha * flick;
        if (alpha <= 0) continue;
        drawGlowText(p.word, p.color, p.x, p.y, alpha, p.fontPx * p.sizeMult);
      }
    }

    function resetToBuild() {
      build();
      frame = 0;
      phase = "build";
      phaseT = 0;
      heart2 = [];
      boom = null;
      tunnel = [];
    }

    function loop(now) {
      if (!running) return;
      const t = now / 1000;
      const dt = lastT ? Math.min(0.06, t - lastT) : 0.016;
      lastT = t;
      phaseT += dt;

      const song = document.getElementById("song");
      const th = thump(song.currentTime || 0);

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      if (phase === "build") {
        frame++;
        for (const p of particles) {
          if (frame > p.delay && p.alpha < 255) {
            p.alpha = Math.min(255, p.alpha + 14 + ((Math.random() * 5) | 0));
          }
        }
        drawParticles();

        const centerStart = fillStartFrame + 200;
        if (frame > centerStart) {
          const progress = Math.min(1.0, (frame - centerStart) / 60);
          const centerAlpha = (1 - Math.exp(-progress * 8));
          const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05) + 0.05 * th;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `bold ${(centerFontPx * pulse).toFixed(1)}px Georgia, serif`;
          ctx.shadowColor = `rgba(255,250,245,${(centerAlpha * 0.6).toFixed(3)})`;
          ctx.shadowBlur = centerFontPx * 0.9;
          ctx.fillStyle = `rgba(255,250,245,${centerAlpha.toFixed(3)})`;
          ctx.fillText(CENTER_TEXT, cx, cy);
          ctx.restore();
        }
        if (frame > centerStart + 100) {          // le cœur est complet → on plonge
          phase = "tunnel";
          phaseT = 0;
          initWarp();
          initTunnel();
        }
      } else if (phase === "tunnel") {
        const fade = Math.min(1, phaseT / 0.45);
        drawWarp(dt, phaseT, fade, 1);
        drawTunnel(dt, phaseT, fade, 1);
        if (phaseT > DIVE) {
          phase = "heart";
          phaseT = 0;
          buildHeart2();
        }
      } else if (phase === "heart") {
        drawTunnel(dt, DIVE, Math.max(0, 1 - phaseT / 1.1), 0.28);
        drawHeart2(phaseT, th);
        if (phaseT > HOLD) {
          phase = "boom";
          phaseT = 0;
          startBoom();
        }
      } else {
        drawBoom(dt, phaseT);
        if (phaseT > BOOM) resetToBuild();
      }

      window.__ily = { phase, tt: phaseT, thump: th, parts: particles.length, heart2: heart2.length, zMean: phase === "tunnel" ? warpZ : 0 };
    }

    function tick() {
      try {
        loop(performance.now());
      } catch (e) {
        window.__ilyErr = String(e && e.message ? e.message : e);
      }
      setTimeout(() => requestAnimationFrame(tick), 1000 / FPS);
    }

    function start() {
      build();
      frame = 0;
      phase = "build";
      phaseT = 0;
      lastT = 0;
      running = true;
      const song = document.getElementById("song");
      song.currentTime = 0;
      song.loop = true;
      song.play().catch(() => {});
      requestAnimationFrame(tick);
    }

    const enter = document.getElementById("enter");
    enter.addEventListener("click", () => {
      enter.classList.add("hidden");
      start();
    });

    // Rebâtir la géométrie au redimensionnement (en repartant proprement)
    let resizeTO;
    window.addEventListener("resize", () => {
      if (!running) return;
      clearTimeout(resizeTO);
      resizeTO = setTimeout(() => { resetToBuild(); }, 150);
    });
  })();
  </script>
